# Every image below has its platform pinned explicitly. On Apple silicon an
# unpinned image often resolves to amd64 and runs under qemu, which turns a
# 40-second Spark start into a five-minute one and makes latency numbers
# meaningless. Pin it once, here, and never debug it again.
#
# Default is linux/arm64 (an M-series laptop). CI runners are amd64 and set
# TARGET_PLATFORM=linux/amd64 -- one variable, not a second compose file.

name: fraudpipe

x-platform: &arm64
  platform: ${TARGET_PLATFORM:-linux/arm64}

services:
  # Kafka in KRaft mode: the broker is its own controller, no ZooKeeper.
  kafka:
    <<: *arm64
    image: apache/kafka:3.7.1
    container_name: fraudpipe-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 6 partitions is the ceiling on per-card parallelism for the feature job.
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: fraudpipe-local-cluster-01
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    <<: *arm64
    image: postgres:16-alpine
    container_name: fraudpipe-postgres
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    ports: ["5432:5432"]
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis is the low-latency read path for the synchronous /score/raw endpoint:
  # Spark's state store is not queryable from outside the job, so the scorer
  # keeps a mirror of the latest per-card state here for on-demand featurizing.
  redis:
    <<: *arm64
    image: redis:7-alpine
    container_name: fraudpipe-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  spark-master:
    <<: *arm64
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: fraudpipe-spark-master
    # The official Apache image has no SPARK_MODE switch (that was a Bitnami
    # convention); the daemon classes are invoked directly.
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    ports: ["8080:8080", "7077:7077"]

  spark-worker:
    <<: *arm64
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: fraudpipe-spark-worker
    depends_on: [spark-master]
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --cores 2 --memory 2G

  # The streaming feature job. Submitted as a client-mode application so its
  # logs land in `docker compose logs feature-job` rather than in the worker's.
  feature-job:
    <<: *arm64
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: fraudpipe-feature-job
    depends_on:
      kafka: {condition: service_healthy}
      spark-master: {condition: service_started}
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      PYTHONPATH: /app/src
    # No --packages: the Kafka connector jars are baked into the image, so
    # startup needs no Ivy resolution and no network.
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf spark.sql.shuffle.partitions=6
      --conf spark.jars.ivy=/tmp/.ivy2
      --conf spark.executor.memory=1500m
      --conf spark.driver.memory=1g
      /app/src/fraudpipe/streaming/job.py
    restart: on-failure

  scorer:
    <<: *arm64
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    container_name: fraudpipe-scorer
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      POSTGRES_DSN: postgresql://fraud:fraud@postgres:5432/fraud
      REDIS_URL: redis://redis:6379/0
      MODEL_PATH: /app/artifacts/model.onnx
      MODEL_VERSION: ${MODEL_VERSION:-dev}
      # Set from artifacts/metrics.json -> chosen_threshold after training.
      DECISION_THRESHOLD: ${DECISION_THRESHOLD:-0.5}
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports: ["8000:8000"]
    entrypoint: ["/app/scripts/scorer-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  replayer:
    <<: *arm64
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    container_name: fraudpipe-replayer
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    volumes:
      - ./data:/app/data:ro
    # Started manually (`docker compose run --rm replayer ...`) so the stack can
    # come up without immediately flooding itself.
    profiles: ["replay"]
    command: >
      python -m fraudpipe.replayer
      --dataset ${DATASET:-ieee}
      --path /app/data/${DATA_FILE:-train_transaction.csv}
      --speedup ${REPLAY_SPEEDUP:-100}

  prometheus:
    <<: *arm64
    image: prom/prometheus:v2.53.0
    container_name: fraudpipe-prometheus
    depends_on: [scorer]
    ports: ["9090:9090"]
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    <<: *arm64
    image: grafana/grafana:11.1.0
    container_name: fraudpipe-grafana
    depends_on: [postgres, prometheus]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
